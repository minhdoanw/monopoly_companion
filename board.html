<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monopoly Host - Spectator Board View</title>
  <link id="theme-stylesheet" rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* Specific styles for the board-only view to optimize for TV/Spectator display */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #161820 0%, #08090c 100%);
      display: flex;
      flex-direction: row;
      font-family: 'Inter', sans-serif;
      color: var(--text-main);
    }
    
    .board-view-container {
      display: flex;
      flex: 1;
      height: 100vh;
      box-sizing: border-box;
      padding: 16px;
      gap: 24px;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    /* Left column for stats */
    .board-sidebar {
      width: 320px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      height: 100%;
      justify-content: flex-start;
      overflow-y: auto;
      max-height: 100vh;
      box-sizing: border-box;
      padding: 20px 4px 20px 0;
    }
    .board-sidebar::-webkit-scrollbar {
      width: 6px;
    }
    .board-sidebar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    .board-sidebar::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
    
    /* Right column for the board itself */
    .board-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    
    /* Force board to fit 100% height/width of its container while remaining square */
    .properties-grid.monopoly-board-layout {
      max-width: 92vh !important;
      max-height: 92vh !important;
      width: 92vh !important;
      height: 92vh !important;
      margin: auto !important;
    }
    
    .spectator-card {
      background: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    
    .spectator-card h3 {
      margin-top: 0;
      margin-bottom: 16px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      color: var(--text-white);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
      font-size: 18px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Player list items in spectator view */
    .spectator-player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.3s ease;
    }
    
    .spectator-player-item.active-turn {
      border-color: var(--color-primary);
      background: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.2);
    }
    
    .spectator-player-item.bankrupt {
      opacity: 0.3;
      text-decoration: line-through;
    }
    
    .player-identity {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .player-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .player-details {
      display: flex;
      flex-direction: column;
    }
    
    .player-details .name {
      font-weight: 600;
      font-size: 14px;
      color: var(--text-white);
    }
    
    .player-details .status {
      font-size: 10px;
      color: var(--text-dim);
    }
    
    .player-balance {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--color-gold);
    }
    
    /* Turn Info */
    .turn-info-card {
      text-align: center;
    }
    
    .turn-info-card .active-avatar {
      font-size: 40px;
      margin-bottom: 8px;
    }
    
    .turn-info-card .active-name {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-white);
    }
    
    .turn-info-card .turn-title {
      font-size: 11px;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }
    
    .spectator-dice {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    
    .spectator-die {
      font-size: 42px;
      background: var(--text-white);
      color: #000;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    
    .no-session-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0f1013;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: var(--text-white);
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    
    .no-session-overlay h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      margin-bottom: 16px;
      color: var(--color-danger);
    }
    
    .no-session-overlay p {
      color: var(--text-dim);
      font-size: 18px;
      max-width: 500px;
      line-height: 1.5;
    }
    
    /* Fullscreen button */
    .btn-fs {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 50;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-white);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
      backdrop-filter: blur(8px);
    }
    .btn-fs:hover {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--color-primary);
    }
    
    /* Read-Only Spec modal overlays */
    .spec-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 200;
    }
    
    .spec-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    
    .spec-modal-content {
      background: #1e293b;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      position: relative;
    }
    
    .spec-modal-header {
      padding: 16px;
      text-align: center;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    .spec-modal-body {
      padding: 24px;
      color: var(--text-white);
    }
    
    .rent-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }
    
    .meta-line {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--text-dim);
    }
    
    .close-spec-modal {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      color: rgba(255,255,255,0.6);
      font-size: 20px;
      cursor: pointer;
      line-height: 1;
    }
    .close-spec-modal:hover {
      color: #fff;
    }

    /* Adjust layout on small viewport or tall aspect ratios */
    @media (max-width: 900px) {
      body {
        flex-direction: column;
        overflow-y: auto;
        height: auto;
      }
      .board-view-container {
        flex-direction: column;
        height: auto;
        padding: 60px 16px 24px 16px;
      }
      .board-sidebar {
        width: 100%;
        max-width: 500px;
        order: 2;
      }
      .board-main {
        width: 100%;
        order: 1;
      }
      .properties-grid.monopoly-board-layout {
        max-width: 95vw !important;
        max-height: 95vw !important;
        width: 95vw !important;
        height: 95vw !important;
      }
    }

    /* Drawn Card Overlay Spec */
    .drawn-card-overlay-spec {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      width: 380px;
      height: 240px;
      z-index: 150;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    .drawn-card-overlay-spec.active {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
      pointer-events: auto;
    }
    
    .drawn-card-face-spec {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      padding: 24px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      border: 3px solid #ffcc00;
      position: relative;
    }
    
    .drawn-card-face-spec::after {
      content: "";
      position: absolute;
      top: 8px;
      left: 8px;
      right: 8px;
      bottom: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      pointer-events: none;
    }
    
    .drawn-card-face-spec.chance-card {
      background: linear-gradient(135deg, #ea580c 0%, #7c2d12 100%);
      border-color: #f97316;
      box-shadow: 0 0 30px rgba(249, 115, 22, 0.4);
    }
    
    .drawn-card-face-spec.chest-card {
      background: linear-gradient(135deg, #0284c7 0%, #0c4a6e 100%);
      border-color: #38bdf8;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
    }
    
    .drawn-card-badge-spec {
      font-family: 'Outfit', sans-serif;
      font-weight: 800;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(0, 0, 0, 0.2);
      width: fit-content;
      margin: 0 auto 12px auto;
      color: #fff;
    }
    
    .drawn-card-title-spec {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 20px;
      text-align: center;
      color: #fff;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .drawn-card-desc-spec {
      font-size: 14px;
      text-align: center;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.4;
      margin: 0;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>

  <!-- Top Right Control Panel -->
  <div class="top-controls-container" style="position: absolute; top: 16px; right: 16px; z-index: 50; display: flex; gap: 10px;">
    <button id="btn-toggle-layout" class="btn-fs" style="position: static;">
      <span>🎛️</span> Show Detailed Cards
    </button>
    <button id="btn-fullscreen-spec" class="btn-fs" style="position: static;">
      <span>⛶</span> Fullscreen View
    </button>
  </div>

  <!-- No session state overlay -->
  <div id="no-session-overlay" class="no-session-overlay">
    <h2>No Active Game Session</h2>
    <p>Please open the companion console page and start a game session first. This board will synchronize automatically once a session is established.</p>
  </div>

  <!-- Spectator Board Container -->
  <div class="board-view-container">
    
    <!-- Left Sidebar: Players Stats & Current Turn -->
    <div class="board-sidebar">
      
      <!-- Current Turn Card -->
      <div class="spectator-card turn-info-card">
        <div class="turn-title">Current Turn</div>
        <div id="current-player-avatar" class="active-avatar">🚗</div>
        <div id="current-player-name" class="active-name">Active Player</div>
        
        <!-- Dice Roll Info -->
        <div id="spectator-dice-box" class="spectator-dice">
          <div class="spectator-die">🎲</div>
          <div class="spectator-die">🎲</div>
        </div>
      </div>
      
      <!-- Leaderboard Overview -->
      <div class="spectator-card">
        <h3>Players & Accounts</h3>
        <div id="spectator-players-list">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
    
    <!-- Main Center Panel: Board Grid -->
    <div class="board-main">
      <div id="properties-board-grid" class="properties-grid monopoly-board-layout">
        <!-- Dynamic Monopoly Board grid elements -->
      </div>
    </div>
  </div>

  <!-- Read-Only Property details modal overlay -->
  <div id="spectator-modal" class="spec-modal-overlay">
    <div class="spec-modal-content">
      <button class="close-spec-modal" onclick="closeSpecModal()">&times;</button>
      <div id="spec-modal-header" class="spec-modal-header">Property Details</div>
      <div id="spec-modal-body" class="spec-modal-body">
        <!-- Dynamic property metrics -->
      </div>
    </div>
  </div>

  <!-- Spectator Drawn Card Overlay -->
  <div id="spectator-card-draw-overlay" class="drawn-card-overlay-spec">
    <div id="drawn-card-face-spec" class="drawn-card-face-spec">
      <div id="drawn-card-badge-spec" class="drawn-card-badge-spec">CHANCE</div>
      <div id="drawn-card-title-spec" class="drawn-card-title-spec">Title</div>
      <p id="drawn-card-desc-spec" class="drawn-card-desc-spec">Desc</p>
    </div>
  </div>

  <!-- Javascript Logic -->
  <script src="monopoly.js"></script>
  <script src="board_ui.js"></script>
</body>
</html>
