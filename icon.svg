<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2a2d3d"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    
    <!-- Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>

    <!-- Dice 1 Gradient -->
    <linearGradient id="dice-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>

    <!-- Dice 2 Gradient -->
    <linearGradient id="dice-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dde8"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  
  <!-- Outer Ring (Gold) -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#gold-grad)" stroke-width="6" opacity="0.8"/>

  <!-- Content Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Dice 1 (Red, rotated) -->
    <g transform="translate(160, 260) rotate(-15)">
      <rect x="-70" y="-70" width="140" height="140" rx="24" fill="url(#dice-grad-1)"/>
      <!-- Dots for 5 -->
      <circle cx="-35" cy="-35" r="10" fill="#ffffff"/>
      <circle cx="35" cy="-35" r="10" fill="#ffffff"/>
      <circle cx="0" cy="0" r="10" fill="#ffffff"/>
      <circle cx="-35" cy="35" r="10" fill="#ffffff"/>
      <circle cx="35" cy="35" r="10" fill="#ffffff"/>
    </g>

    <!-- Dice 2 (White, rotated differently) -->
    <g transform="translate(320, 210) rotate(18)">
      <rect x="-65" y="-65" width="130" height="130" rx="22" fill="url(#dice-grad-2)"/>
      <!-- Dots for 6 -->
      <circle cx="-30" cy="-35" r="9" fill="#2a2d3d"/>
      <circle cx="30" cy="-35" r="9" fill="#2a2d3d"/>
      <circle cx="-30" cy="0" r="9" fill="#2a2d3d"/>
      <circle cx="30" cy="0" r="9" fill="#2a2d3d"/>
      <circle cx="-30" cy="35" r="9" fill="#2a2d3d"/>
      <circle cx="30" cy="35" r="9" fill="#2a2d3d"/>
    </g>
    
    <!-- Monopoly 'M' Ribbon -->
    <path d="M 120,380 L 392,380 L 372,430 L 140,430 Z" fill="url(#gold-grad)"/>
    <text x="256" y="418" font-family="'Outfit', 'Inter', sans-serif" font-size="32" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="4">MONOPOLY</text>
  </g>
</svg>
